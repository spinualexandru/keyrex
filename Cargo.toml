[package]
name = "keyrex"
version = "0.3.0"
edition = "2021"
description = "Secure, lightweight key-value vault for managing secrets locally using AES-256-GCM encryption."
keywords = ["rust", "encryption", "vault", "cli", "security"]
license = "Apache-2.0"
homepage = "https://github.com/spinualexandru/keyrex"
repository = "https://github.com/spinualexandru/keyrex"
documentation = "https://github.com/spinualexandru/keyrex#readme"
categories = ["command-line-utilities"]

[dependencies]
aes-gcm = "0.11.1"
arboard = "3.6.1"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
colored = "3.1.1"
dirs = "7.0.0"
fslock = "0.2.1"
hmac = "0.13.0"
pbkdf2 = "0.13.0"
rand = "0.10.2"
rpassword = "7.5.4"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive", "serde_derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.11.0"
shellexpand = "3.1.2"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
zeroize = "1.9.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[lib]
name = "keyrex"
path = "src/lib.rs"

[[bin]]
name = "keyrex"
path = "src/main.rs"
